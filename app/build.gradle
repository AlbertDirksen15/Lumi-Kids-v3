plugins {
    id 'com.android.application'
}

android {
    namespace 'com.albertd.lumikidsv3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.albertd.lumikidsv3'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['wav', 'mdl', 'fst', 'conf', 'txt', 'json']
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
